<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まいにち英単語</title>
  <meta name="robots" content="noindex">
  <script>
    // koichi1969.github.io の下で見つからない URL のときに表示される。
    // 1) 大文字が混ざっている（例 /EnglishWords1800/）→ 小文字に直して開き直す
    // 2) それでも見つからない → まいにち英単語の入口へ
    (function () {
      var path = location.pathname;
      var lower = path.toLowerCase();
      location.replace(lower !== path ? lower + location.search + location.hash : '/englishwords1800/');
    })();
  </script>
  <style>
    body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #FFF6EC; color: #2B2B3B; text-align: center; padding: 64px 16px; }
    a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 999px; background: #FF6B4A; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <p>ページが見つかりませんでした。まいにち英単語へ移動します…</p>
  <a href="/englishwords1800/">まいにち英単語を開く</a>
</body>
</html>
